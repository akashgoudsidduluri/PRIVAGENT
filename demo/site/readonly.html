<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Northwind Demo CRM — Read-only record (Synthetic)</title>
  <style>
    body { margin:0; font:15px/1.5 system-ui, Segoe UI, sans-serif; color:#172033; background:#f4f6fb; }
    header { padding:22px 28px; background:#101a33; color:#fff; }
    header h1 { margin:0; font-size:20px; }
    main { max-width:760px; margin:26px auto; padding:0 20px 60px; }
    .card { background:#fff; border:1px solid #d9dee8; border-radius:12px; padding:20px; }
    label { display:block; font-size:12px; font-weight:600; color:#5b6475; margin:14px 0 4px; }
    input, button { font:inherit; padding:9px 11px; border:1px solid #b8c1d4; border-radius:8px; }
    input[readonly] { background:#eef1f7; color:#4b5568; }
    button { background:#1f5eff; border-color:#1f5eff; color:#fff; font-weight:600; }
    .note { color:#9a3412; font-size:13px; margin-top:12px; }
  </style>
</head>
<body>
  <header><h1>Northwind Demo CRM</h1></header>
  <main>
    <section class="card">
      <h2>Locked customer record</h2>
      <p>Account identifiers are system-assigned and cannot be edited from this screen.</p>
      <form id="record-form">
        <label for="customer-id">Customer ID</label>
        <input id="customer-id" name="customerId" type="text" value="CUST-1042" readonly />
        <label for="search">Search</label>
        <input id="search" name="q" type="search" placeholder="Search records" />
        <div style="margin-top:16px"><button type="submit">Save changes</button></div>
      </form>
      <div class="note" id="status" aria-live="polite"></div>
    </section>
  </main>
  <script>
    document.getElementById("record-form").addEventListener("submit", (event) => {
      event.preventDefault();
      document.getElementById("status").textContent =
        "No changes saved: Customer ID is read-only.";
    });
  </script>
</body>
</html>
